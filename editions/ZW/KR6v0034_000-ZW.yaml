front:
  text: 因緣心論釋整理者華方田題解因緣心論釋印度大乘佛教中觀學派典籍龍樹撰一卷本文獻作者龍樹又譯龍猛是大乘佛教鼻祖印度大乘佛教中觀學派的創始人有第二佛陀之稱生存年代約公元年年龍樹著述頗豐有千部論主之稱其代表作是中論十二門論大毗婆沙論大智度論等因緣心論釋也是其重要著作之一是研究龍樹及其大乘中觀學說的重要資料本文獻是龍樹對因緣心論頌所作的疏釋作者站在大乘空宗的立場上對佛教緣起論因果論作了新的闡釋本文獻未為我國歷代大藏經所收近代在敦煌發現後被收錄於大正藏第三十二卷第一六五四部但由於僅用了兩個本子斯號和斯號且錯訛較多因此有必要進行重新整理同時為了盡可能地避免錯誤整理者將因緣心論頌因緣心論釋和因緣心釋論開決記三篇文獻作了仔細的對勘具體情況隨文說明整理本底校本情況如下底本中國北京圖書館藏北海號校本甲本斯號乙本北官號殘丙本伯號丁本斯號殘戊本斯號己本斯號背殘庚本北大錄文
