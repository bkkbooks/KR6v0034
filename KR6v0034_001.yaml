body:
  text: 龍猛菩薩造此中有沙門樂聞能聽善能憶持能悟能觀及具簡棄來詣師所於如來教中作如是問薄伽梵差別十二支能仁說緣生彼於何所攝今欲樂聞知彼問其真義師即呼曰汝於煩惱業苦三中俱攝盡作此分明典切之語此中十及二故曰十二支即差別故言差別如車支分故說為支能寂身口故名能仁言能仁說者宣暢解釋說之異名彼非自性決定士夫相假自在時自然隨欲化主偶遇等所生此是因緣所生此差別十二支法於煩惱業苦遞互相依猶如束蘆於彼三中並皆攝盡言盡者即是無餘義也問曰何者煩惱何者是業何者是苦此差別之法當於何攝答曰初八九煩惱差別十二支法初是無明第八是愛第九是取此三是煩惱所攝何者是業二及十是業二是行十是有此二法是業所攝餘七皆是苦惱煩業支所攝之餘七種是苦所攝應知所謂識名色六入觸受生老死言皆者是總攝之辭即攝愛別離怨憎會求不得苦是故此十二支法於業煩惱苦中並皆盡攝言唯者是其遮義經中所說之法此中攝盡更無有餘問曰此義已知彼煩惱業苦云何相生請為解說答曰從三生於二從三煩惱生於二業從二生於七謂上所說苦法七復生於三所謂諸煩惱復從三煩惱生於二業此有輪數轉言有者有其三種所謂欲色無色於中不息而作流輪彼諸異生世間而自流浪言此者顯不定義非如輪轉次第生於諸有此即不定問曰何者是身之自在衆生耶彼之作用其事云何答曰諸趣唯因果唯除假名此中無衆生此是真實義非假立有假立之境不成實物問曰若如是者誰從此世至於他世答曰無有極微等法從於此世移至他世雖然唯從於空法還生於空法從無我我所煩惱業五種空因還生空無我我所七種苦果之法彼則無我我所彼此互無我我所雖然從自性無我之法還生自性無我之法應如是知作如是說此中問曰從自性無我之法還生自性無我法者有何譬喻此中答曰誦燈鏡及印火精種梅聲已如是等喻及假立成自性無我及成就彼此世應知譬如師所誦者若轉至弟子師後更無言說是故不至彼弟子誦者亦不從餘得成無因過故如師所誦臨終心識亦復如是成常過故不至他世彼世亦不從餘得成無因過故如師所誦與弟子誦者即彼異彼不易施設依彼臨終心識生分心識得生者亦復如是即彼異彼不易施設如是從燈生燈依於面像鏡中現其影像從印成文從精出火從種生芽從梅生涎從聲出響即彼異彼不易施設如是諸蘊相續結不移智應察言蘊者即色受想行識蘊也言相續結者滅已從彼因所生餘者是也無有極微等法從於此世移至他世是故流轉從於虛妄分別習氣而生後言應者即是逆觀義當知反彼應觀諸法無常苦空無我者則不愚諸事若不愚者則無有貪若無有貪瞋則不生若無有瞋則無有業若無有業則無有取若無有取則不造後有若無後有而即不生若不生者即於身心而苦不生如是不集五種因故即於餘處而果不生此是解脫是故斷除斷常等諸惡見也此中有二頌於甚微細事若有見斷者彼不善因緣未見緣生義此中無可遣亦無少安立於真以觀真見真而解脫録文完
